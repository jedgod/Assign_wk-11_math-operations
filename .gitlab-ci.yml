stages:
  - test
  - validate
  - run

test:
  stage: test
  image: python:3.11
  before_script:
    - pip install pyyaml pytest
  script:
    - echo "Running unit tests..."
    - pytest --junitxml=test-results.xml -v
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml

validate:
  stage: validate
  image: python:3.11
  before_script:
    - pip install pyyaml
  script:
    - echo "Validating configuration..."
    - python -c "
import yaml
config = yaml.safe_load(open('config.yml'))
print('OK!! Config loaded successfully')
print('Numbers:', config.get('numbers'))
print('Polynomial ready for evaluation')
"

run:
  stage: run
  image: python:3.11
  before_script:
    - pip install pyyaml
  script:
    - echo 'Running full application...'
    - python main.py