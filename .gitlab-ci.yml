stages:
  - test
  - production
  - run

variables:
  PYTHON_VERSION: "3.11"

test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - pip install pyyaml pytest
  script:
    - echo " Running unit tests..."
    - pytest --junitxml=test-results.xml -v
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml

production:
  stage: production
  image: python:${PYTHON_VERSION}
  before_script:
    - pip install pyyaml
  script:
    - echo "📦 Production validation..."
    - python -c "
import yaml
config = yaml.safe_load(open('config.yml'))
print('OK!! Config loaded successfully')
print('Numbers:', config.get('numbers'))
print('Polynomial ready for evaluation')
"
  when: on_success

run:
  stage: run
  image: python:${PYTHON_VERSION}
  before_script:
    - pip install pyyaml
  script:
    - echo " Yay!!!!, Running full application..."
    - python main.py
  when: on_success