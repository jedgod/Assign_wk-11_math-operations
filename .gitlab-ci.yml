stages:
  - test
  - validate
  - production

variables:
  PYTHON_VERSION: "3.11"

before_script:
  - pip install --upgrade pip
  - pip install -r requirements.txt

test:
  stage: test
  image: python:${PYTHON_VERSION}
  script:
    - pytest -v --junitxml=test-results.xml
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml
    when: always

validate_math_app:
  stage: validate
  image: python:${PYTHON_VERSION}
  script:
    - python -m py_compile main.py math_operations.py app.py
    - python -c "import yaml; yaml.safe_load(open('config.yml')); print('config.yml OK')"
    - python -c "import app; print('Streamlit math UI import OK')"

production:
  stage: production
  image: python:${PYTHON_VERSION}
  script:
    - python main.py
  only:
    - main
    - master